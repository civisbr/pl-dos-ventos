name: Validar e publicar o site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar dados e gerar HTML
        run: python3 scripts/gerar_site.py
      - name: Empacotar site público
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _dist

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar que a versão ainda é a mais recente
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          printf 'atual=%s\n' "$([ "$latest" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publicar no GitHub Pages
        id: deployment
        if: steps.head.outputs.atual == 'true'
        uses: actions/deploy-pages@v4
